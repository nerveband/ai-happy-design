version: 2

before:
  hooks:
    - go mod tidy
    - make build-plugin sync-plugin

builds:
  - id: ahd-figma
    main: ./cmd/ahd-figma
    binary: ahd-figma
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    hooks:
      post:
        - cmd: '{{ if eq .Os "darwin" }}codesign -s - -f "{{ .Path }}"{{ else }}true{{ end }}'
  - id: ahd-illustrator
    main: ./cmd/ahd-illustrator
    binary: ahd-illustrator
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    hooks:
      post:
        - cmd: 'codesign -s - -f "{{ .Path }}"'

archives:
  - id: ahd-figma
    builds:
      - ahd-figma
    format: tar.gz
    name_template: >-
      ahd-figma_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*
  - id: ahd-illustrator
    builds:
      - ahd-illustrator
    format: tar.gz
    name_template: >-
      ahd-illustrator_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: nerveband
    name: ai-happy-design
  draft: false
  prerelease: auto
